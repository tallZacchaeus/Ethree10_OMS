packages:
  - "."

# Build-script approvals for pnpm 10+/11 (decisions recorded so `pnpm install`
# stops erroring with ERR_PNPM_IGNORED_BUILDS). Prisma builds (needed for the DB
# query engine); the rest aren't required to run the Next dev server.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@sentry/cli': false
  core-js: false
  msgpackr-extract: false
  protobufjs: false
  unrs-resolver: false
  sharp: true

# Transitive advisories with no direct upgrade path: these packages are pulled
# in by eslint, tailwind/postcss, prisma and vite rather than declared here, so
# the only way to move them is an override. Each is the minimum patched version
# named by `pnpm audit`. Remove an entry once the parent ships the fix itself.
overrides:
  # Deliberately NOT overriding brace-expansion. Forcing it forward breaks
  # minimatch@3, which eslint depends on, and `pnpm lint` dies with a
  # FlatConfigArray error. The advisory is a denial of service in a build-time
  # glob matcher — an attacker would need to control an eslint glob pattern.
  # Not worth trading a working linter for.
  "browserslist": ">=4.28.7"
  "js-yaml": ">=4.3.1"
  "nanoid": ">=3.3.18"
  "postcss": ">=8.5.23"
  "dompurify": ">=3.4.13"
  "esbuild": ">=0.24.3"
  "fflate": ">=0.4.9"
  "protobufjs": ">=7.6.5"
  "@opentelemetry/core": ">=2.8.0"
