name: Branch heads

# Reports who leads each branch, and sets a lead when told who.
#
# Readiness has warned "0/2 active teams have a lead assigned" since launch.
# That is not cosmetic: the assignment flow routes every auto-proposal to the
# branch head for approval, so with no lead the proposals have nobody to
# approve them and the feature is inert.
#
# Manual only. With no emails supplied it reports and writes nothing, which is
# also how you find out who the candidates are — the script will not pick a
# head on its own, because that is a decision about people rather than a gap in
# the data.
on:
  workflow_dispatch:
    inputs:
      assignments:
        # Free-form rather than one input per branch. The first version hardcoded
        # "digital-media" and "tech-product" from the canonical list, and running
        # the report showed production actually has three branches, one of which
        # ("product-tech-team") is where the real Product/Tech staff sit. A tool
        # that can only address the branches someone assumed exist is no use for
        # finding out that the assumption was wrong.
        description: "slug=email pairs, comma separated. Blank reports only. e.g. digital-media=a@x.com,product-tech-team=b@x.com"
        type: string
        required: false

env:
  SSH_USER: root

jobs:
  branch-heads:
    name: ${{ inputs.assignments != '' && 'Assign branch heads' || 'Report branch heads' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/ethree10_deploy_key
          chmod 600 ~/.ssh/ethree10_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Report or assign
        run: |
          set -euo pipefail
          ARGS=""
          RAW="${{ inputs.assignments }}"
          if [ -n "$RAW" ]; then
            # Split on commas; each pair is validated by the script, which
            # refuses an unknown branch or an unknown user rather than guessing.
            IFS=',' read -ra PAIRS <<< "$RAW"
            for pair in "${PAIRS[@]}"; do
              trimmed="$(echo "$pair" | xargs)"
              [ -n "$trimmed" ] && ARGS="$ARGS --set $trimmed"
            done
          fi
          if [ -z "$ARGS" ]; then ARGS="--dry-run"; fi

          ssh -i ~/.ssh/ethree10_deploy_key "${SSH_USER}@${{ secrets.VPS_HOST }}" \
            "cd /srv/ethree10/ethree10 && pnpm assign:branch-heads $ARGS"

      - name: Readiness afterwards
        if: ${{ always() }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ethree10_deploy_key "${SSH_USER}@${{ secrets.VPS_HOST }}" \
            "cd /srv/ethree10/ethree10 && pnpm check:readiness:db 2>&1 | grep -E 'Team heads'" || true
