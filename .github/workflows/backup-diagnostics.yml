name: Backup diagnostics

# Reads the state of the VPS backup jobs and prints it.
#
# Manual only, and read-only by construction: every command below lists,
# prints, or reports. Nothing here writes a file, takes a backup, restarts a
# service or changes configuration — so it is safe to run at any time, on a
# healthy server or a broken one, without thinking about consequences first.
#
# Written because both backups had been dead for weeks (database since
# 2026-07-03, uploads since 2026-06-28) and diagnosing it meant relaying shell
# output by hand. `pnpm check:backups` says *that* a backup is stale; this says
# *why* — whether cron is running, whether the scripts still exist, whether the
# disk is full, and what the scripts say when the logs are read back.
on:
  workflow_dispatch:

env:
  SSH_USER: root

jobs:
  diagnose:
    name: Read backup state on the VPS
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/ethree10_deploy_key
          chmod 600 ~/.ssh/ethree10_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Collect diagnostics
        run: |
          set -euo pipefail
          # `|| true` on the remote side, per section, so one missing path or
          # absent log file cannot cut the report short. A workflow that dies
          # on its first unknown is exactly what made this hard to diagnose in
          # the first place — we want every section, especially the empty ones.
          ssh -i ~/.ssh/ethree10_deploy_key "${SSH_USER}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          section() { printf '\n===== %s =====\n' "$1"; }

          section "Backup files on disk (newest last)"
          ls -la --time-style=long-iso /srv/ethree10/backups/db/ 2>&1 | tail -6 || true
          echo "---"
          ls -la --time-style=long-iso /srv/ethree10/backups/minio/ 2>&1 | tail -6 || true

          section "Backup scripts present and executable"
          ls -la /srv/ethree10/backup-db.sh /srv/ethree10/backup-minio.sh 2>&1 || true

          section "Root crontab"
          crontab -l 2>&1 || true

          section "System cron directories"
          ls -la /etc/cron.d/ 2>&1 || true
          echo "--- /etc/crontab ---"
          grep -v '^#' /etc/crontab 2>&1 | grep -v '^$' || true

          section "Is cron actually running?"
          systemctl is-active cron 2>&1 || systemctl is-active crond 2>&1 || true
          systemctl status cron --no-pager -n 5 2>&1 | head -12 || true

          section "Recent cron log entries"
          journalctl -u cron --no-pager -n 25 2>&1 | tail -25 || true
          echo "--- syslog fallback ---"
          grep -i cron /var/log/syslog 2>/dev/null | tail -15 || true

          section "Disk space"
          df -h /srv /var /tmp 2>&1 || true

          section "Inode usage (a full inode table fails writes on a disk with free space)"
          df -i /srv 2>&1 || true

          section "Backup script logs, if any"
          for log in /var/log/ethree10-backup.log /srv/ethree10/backup.log /srv/ethree10/logs/backup.log; do
            if [ -f "$log" ]; then
              echo "--- $log (last 20) ---"
              tail -20 "$log" 2>&1 || true
            fi
          done

          section "Postgres reachable for pg_dump?"
          # Version only. No data is read, listed, or written.
          if command -v pg_dump >/dev/null 2>&1; then pg_dump --version 2>&1; else echo "pg_dump NOT INSTALLED — this alone would stop the database backup"; fi

          section "Current backup check verdict"
          cd /srv/ethree10/ethree10 && pnpm check:backups 2>&1 || true
          REMOTE
